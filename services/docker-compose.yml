version: '3.6'
services:
  db:
    image: postgres:12.4
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgres
    networks:
      - alcs

  redis:
    image: "redis:alpine"
    command: redis-server --requirepass redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - alcs

  pgtap:
    image: hbpmip/pgtap:1.0.0-2
    environment:
      - DATABASE=postgres
      - USER=postgres
      - PASSWORD=postgres
    command:
      - cp /mnt/** /test
    volumes:
      - ./apps/alcs/test/pgtap:/test
    networks:
      - alcs

  minio:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: miniopassword

    volumes:
      - s3:/data
    ports:
      - '80:9000'
      - '9001:9001'
    networks:
      - alcs

  clamav:
    image: clamav/clamav:stable_base
    volumes:
      # Socket
      - clamsocket:/var/run/clamav/
      - clamav:/var/lib/clamav
    ports:
      - "3310:3310"
    networks:
      - alcs


#  metabase:
#    image: metabase/metabase:latest
#    environment:
#      - MB_DB_TYPE=postgres
#      - MB_DB_DBNAME=postgres
#      - MB_DB_PORT=5432
#      - MB_DB_USER=postgres
#      - MB_DB_PASS=postgres
#      - MB_DB_HOST=db
#    ports:
#      - "3000:3000"
#    networks:
#      - alcs

volumes:
  postgres:
  s3:
  clamav:
  clamsocket:

networks:
  alcs:
    name: alcs
    driver: bridge
